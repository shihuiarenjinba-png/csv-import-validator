name: windows-rc

on:
  push:
    branches:
      - release/windows-portable-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Build and verify RC
        shell: pwsh
        run: ./build-windows-portable.ps1

      - name: Upload RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-contract-schema-drift-auditor-windows-rc
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
