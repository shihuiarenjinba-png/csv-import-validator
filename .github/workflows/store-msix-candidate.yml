name: Data Contract Auditor Store MSIX candidate gate

on:
  push:
    branches:
      - codex/store-p0-data-contract-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-preflight:
    runs-on: windows-latest
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
      approved_version: ${{ steps.preflight.outputs.approved_version }}
    steps:
      - name: Checkout dedicated work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source unit tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Compile source and packaging scripts
        run: python -m compileall -q app.py contract_auditor.py validator.py tests store
      - name: Run Store package readiness preflight
        id: preflight
        shell: pwsh
        run: ./store/build-msix.ps1 -PreflightOnly
      - name: Preserve preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-contract-store-preflight-${{ github.run_id }}
          path: store-output/**
          if-no-files-found: error
          retention-days: 30

  qa-unsigned-structural-msix:
    needs: regression-preflight
    if: always() && needs.regression-preflight.result == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout dedicated work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate QA-only placeholder package logos
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'data-contract-qa-assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          foreach ($spec in @(
            @('StoreLogo.png',50,50),
            @('Square44x44Logo.png',44,44),
            @('Square150x150Logo.png',150,150),
            @('Wide310x150Logo.png',310,150)
          )) {
            $name = [string]$spec[0]; $w = [int]$spec[1]; $h = [int]$spec[2]
            $bmp = New-Object System.Drawing.Bitmap($w,$h)
            try {
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              try {
                $g.Clear([System.Drawing.Color]::White)
                $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::Black,2)
                try { $g.DrawRectangle($pen,1,1,$w-3,$h-3) } finally { $pen.Dispose() }
              } finally { $g.Dispose() }
              $bmp.Save((Join-Path $assets $name),[System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bmp.Dispose() }
          }
          Write-Host 'QA_ASSETS=GENERATED_NOT_STORE_APPROVED'
      - name: Build, pack, unpack, and verify QA-only unsigned MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaVersion = "1.0.$($env:GITHUB_RUN_NUMBER).0"
          $assets = Join-Path $env:RUNNER_TEMP 'data-contract-qa-assets'
          ./store/build-msix.ps1 -QaUnsigned -Version $qaVersion -AssetsDirectory $assets
          if ($LASTEXITCODE -ne 0) { throw "QA MSIX builder failed: $LASTEXITCODE" }
          Write-Host "QA_UNSIGNED_VERSION=$qaVersion"
          Write-Host 'STORE_SUBMISSION_AUTHORIZED=FALSE'
      - name: Preserve QA-only MSIX and hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: data-contract-QA_UNSIGNED-validation-msix-${{ github.run_id }}-${{ github.run_attempt }}
          path: store-output/**
          if-no-files-found: error
          retention-days: 30

  build-unsigned-candidate:
    needs: regression-preflight
    if: needs.regression-preflight.outputs.ready == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout dedicated work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build, pack, unpack, and verify the unsigned MSIX
        shell: pwsh
        run: ./store/build-msix.ps1 -Version "${{ needs.regression-preflight.outputs.approved_version }}"
      - name: Preserve MSIX candidate and hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: data-contract-QA_UNSIGNED-msix-${{ github.run_id }}
          path: store-output/**
          if-no-files-found: error
          retention-days: 30
