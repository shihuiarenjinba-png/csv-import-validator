name: Data Contract Auditor Store MSIX candidate gate

on:
  push:
    branches:
      - codex/store-p0-data-contract-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-preflight:
    runs-on: windows-latest
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
      approved_version: ${{ steps.preflight.outputs.approved_version }}
    steps:
      - name: Checkout dedicated work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source unit tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Compile source and packaging scripts
        run: python -m compileall -q app.py contract_auditor.py validator.py tests store
      - name: Run Store package readiness preflight
        id: preflight
        shell: pwsh
        run: ./store/build-msix.ps1 -PreflightOnly
      - name: Preserve preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-contract-store-preflight-${{ github.run_id }}
          path: store-output/**
          if-no-files-found: error
          retention-days: 30

  build-unsigned-candidate:
    needs: regression-preflight
    if: needs.regression-preflight.outputs.ready == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout dedicated work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build, pack, unpack, and verify the unsigned MSIX
        shell: pwsh
        run: ./store/build-msix.ps1 -Version "${{ needs.regression-preflight.outputs.approved_version }}"
      - name: Preserve MSIX candidate and hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: data-contract-msix-candidate-${{ github.run_id }}
          path: store-output/**
          if-no-files-found: error
          retention-days: 30
