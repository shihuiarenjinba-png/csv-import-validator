name: Group C cross-platform regression diagnostic

on:
  push:
    branches:
      - codex/store-p0-data-contract-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py contract_auditor.py validator.py tests store
      - name: Run unit regressions
        run: python -m unittest discover -s tests -p 'test*.py' -v
