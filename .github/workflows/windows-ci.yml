name: Windows CI

on:
  push:
    branches: [main, product-rework-20260917]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q .
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DataContractAuditor app.py
      - name: Create checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\DataContractAuditor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DataContractAuditor.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataContractAuditor-windows
          path: |
            dist/DataContractAuditor.exe
            dist/SHA256SUMS.txt
